name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt || true
          pip install -r web-app/backend/requirements.txt || true
      - name: Run pytest
        run: pytest -q || true

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose up
        run: |
          cd data-integration || exit 0
          docker-compose up -d || true
          sleep 10
          docker-compose ps || true